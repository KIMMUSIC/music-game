name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  NODE_VERSION: '20'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/services/*/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint || true

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install shared dependencies
        working-directory: backend/shared
        run: npm install

      - name: Install auth service dependencies
        working-directory: backend/services/auth
        run: npm install

      - name: Build auth service
        working-directory: backend/services/auth
        run: npm run build

      - name: Install quiz service dependencies
        working-directory: backend/services/quiz
        run: npm install

      - name: Build quiz service
        working-directory: backend/services/quiz
        run: npm run build

      - name: Install game service dependencies
        working-directory: backend/services/game
        run: npm install

      - name: Build game service
        working-directory: backend/services/game
        run: npm run build

      - name: Install social service dependencies
        working-directory: backend/services/social
        run: npm install

      - name: Build social service
        working-directory: backend/services/social
        run: npm run build

  docker-build-test:
    runs-on: ubuntu-latest
    needs: lint-and-test

    strategy:
      matrix:
        service: [auth, quiz, game, social, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service == 'frontend' && 'frontend/Dockerfile' || format('backend/services/{0}/Dockerfile', matrix.service) }}
          push: false
          tags: musicquiz-${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
