<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>

  <!-- Music note -->
  <g fill="white">
    <!-- Note head 1 -->
    <ellipse cx="35" cy="65" rx="10" ry="8" transform="rotate(-20 35 65)"/>
    <!-- Note head 2 -->
    <ellipse cx="60" cy="58" rx="10" ry="8" transform="rotate(-20 60 58)"/>
    <!-- Stems -->
    <rect x="43" y="20" width="4" height="47" rx="2"/>
    <rect x="68" y="13" width="4" height="47" rx="2"/>
    <!-- Beam -->
    <path d="M43 20 L72 13 L72 23 L43 30 Z"/>
  </g>

  <!-- Question mark accent -->
  <circle cx="78" cy="78" r="16" fill="#FBBF24"/>
  <text x="78" y="85" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F2937" font-family="Arial, sans-serif">?</text>
</svg>
